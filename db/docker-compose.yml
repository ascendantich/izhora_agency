version: '3.8'
services:
  db:
    image: postgres:15
    container_name: postgres_db_win
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: local_dev_db
    ports:
      - "5433:5432"
    volumes:
      # Использование именованного volume — самый надежный способ на Windows,
      # чтобы избежать проблем с правами доступа к папкам NTFS
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: